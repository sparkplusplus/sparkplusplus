name: Publish
on:
#  release:
#    types: [created]
  push:
#    branches: [ "main" ]
    tags:
      - '*'
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - scala-profile: scala-2.12
          - scala-profile: scala-2.13
    steps:
      - uses: actions/checkout@v4
      - name: Set Scala 2.13 artifact coordinates
        if: matrix.scala-profile == 'scala-2.13'
        run: |
          for pom in sparkplusplus-core/pom.xml sparkplusplus-config/pom.xml sparkplusplus-testkit/pom.xml sparkplusplus-cli/pom.xml; do
            sed -i 's|_2.12|_2.13|g' "$pom"
          done
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version
        run: mvn versions:set -DnewVersion=${{ github.ref_name }}

      - name: Build and test with ${{ matrix.scala-profile }}
        run: mvn -B clean verify -P${{ matrix.scala-profile }}

      - name: Publish package for ${{ matrix.scala-profile }}
        run: mvn -P sonatypeDeploy -P${{ matrix.scala-profile }} --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
