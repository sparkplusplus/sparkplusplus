name: Publish
on:
#  release:
#    types: [created]
  push:
#    branches: [ "main" ]
    tags:
      - '*'
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - scala-profile: scala-2.12
            artifact-id: sparkplusplus_2.12
          - scala-profile: scala-2.13
            artifact-id: sparkplusplus_2.13
    steps:
      - uses: actions/checkout@v4
      # Keep artifactId constant in pom.xml by default (2.12), then switch per matrix job.
      # This avoids expression-based artifactId issues that Central can reject.
      - name: Set artifactId for ${{ matrix.scala-profile }}
        run: |
          sed -i "s|<artifactId>sparkplusplus_2.12</artifactId>|<artifactId>${{ matrix.artifact-id }}</artifactId>|" pom.xml
      - name: Set up Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set version
        run: mvn versions:set -DnewVersion=${{ github.ref_name }}

      - name: Build and test with ${{ matrix.scala-profile }}
        run: mvn -B clean verify -P${{ matrix.scala-profile }}

      - name: Publish package for ${{ matrix.scala-profile }}
        run: mvn -P sonatypeDeploy -P${{ matrix.scala-profile }} --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
