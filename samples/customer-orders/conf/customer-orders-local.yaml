apiVersion: sparkplusplus.io/v1
application:
  name: customer-orders
  version: 0.1.0
  settings:
    owner: analytics
inputs:
  - name: customers
    path: src/test/resources/input/customers.json
    format: json
    schemaPath: schemas/customers.json
    filter: customer_status = 'ACTIVE'
  - name: orders
    path: src/test/resources/input/orders.csv
    format: csv
    options:
      header: "true"
    schemaPath: schemas/orders.json
outputs:
  - name: customer_orders
    path: target/customer-orders-output
    format: parquet
    mode: overwrite
    partitionBy:
      - order_order_date
    coalesce: 1
sparkConfig:
  spark.master: local[2]
  spark.app.name: customer-orders-local
  spark.ui.enabled: "false"
  spark.sql.shuffle.partitions: "1"
  spark.sql.session.timeZone: UTC
  spark.sql.warehouse.dir: target/spark-warehouse
